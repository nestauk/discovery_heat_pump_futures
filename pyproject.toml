[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["discovery_heat_pump_futures"]

[project]
name = "discovery_heat_pump_futures"
version = "0.1.0"
description = "Identifying emerging technologies that could become the future of heatpumps"
authors = [{name = "Rosie Oxbury"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "discovery-utils>=0.1.0",
    "pandas>=2.2.3",
]

[project.urls]
repository = "https://github.com/nestauk/discovery_heat_pump_futures"
issues = "https://github.com/nestauk/discovery_heat_pump_futures/issues"

[dependency-groups]
dev = [
    "ipykernel",
    "jupytext",
    "ruff",
    "Sphinx",
    "sphinxcontrib-napoleon",
    "sphinx-rtd-theme",
    "pytest",
    "pre-commit",
    "pre-commit-hooks",
]

[tool.jupytext]
# Always pair ipynb notebooks to py:percent files
default_jupytext_formats = "ipynb,py:percent"
# Comment out magics (allows code formatting)
comment_magics = true
# Strip cell-level metadata (avoid polluting git diffs)
default_cell_metadata_filter = "-all"

[tool.ruff.lint]
select = ["ANN", "B", "C", "D", "E", "F", "I", "N", "W"]
# S101 - warns about assert being removed when compiled
# D100 - warns about missing module-level docstrings
ignore = ["S101", "D100", "D103", "D205", "D212","D415", "E501", "I001"]
mccabe = { max-complexity = 10 }

[tool.ruff.lint.isort]
known-first-party = ["discovery_heat_pump_futures"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402", "D104"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.uv.sources]
discovery-utils = { git = "https://github.com/nestauk/discovery_utils.git" }
